name: Sentinel · posições on-chain gratuitas
on:
  schedule:
    - cron: '8,38 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'onchain-public.cjs'
      - 'onchain-core.js'
      - 'onchain-config.json'
      - '.github/workflows/onchain-monitor.yml'
concurrency:
  group: sentinel-onchain-public
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    # Standard public-repository runners are free. Never consume private paid minutes.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar análise de posições
        run: node --test tests/onchain.test.cjs
      - name: Consultar somente fontes públicas sem chave
        run: node onchain-public.cjs
      - name: Atualizar relatório público
        run: |
          git config user.name "sentinel-trade-bot"
          git config user.email "actions@users.noreply.github.com"
          git add onchain-report.json
          git diff --cached --quiet || (git commit -m "Atualiza posições on-chain" && git pull --rebase && git push)
